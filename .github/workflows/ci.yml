name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: test (race)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: test
        if: runner.os != 'Linux'
        run: go test -count=1 ./...
      - name: fuzz policy (30s)
        if: runner.os == 'Linux'
        run: go test -run='^$' -fuzz=FuzzEvaluate -fuzztime=30s ./internal/policy/
